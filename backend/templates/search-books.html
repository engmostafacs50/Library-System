{% extends "base.html" %}
{% load static %}

{% block title %}Online Library | Search Books{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'CSS/navbar.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/search-books.css' %}">
{% endblock %}

{% block content %}

  <nav>
    <span class="nav-brand">Library System</span>
    <div class="nav-links">
      <a href="{% url 'homepage' %}">Home</a>
      <a href="{% url 'user-dashboard' %}">Profile</a>
      <a href="{% url 'search-books' %}" class="active">Search</a>
      <a href="{% url 'view-books' %}">Books</a>
      <a href="{% url 'borrowed-books' %}">Borrowed</a>
      <a href="{% url 'returned-books' %}">Returned</a>
    </div>
    <div class="nav-logout">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    </div>
  </nav>

  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
  </div>

  <div class="hero">
    <div class="label-chip">Online Library</div>
    <h2>Search for a Book</h2>
    <div class="search-wrap">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" fill="none"
          stroke="white" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" placeholder="Enter book name, author, or genre..." />
        <button class="search-btn">Search</button>
      </div>
    </div>
  </div>

  <div class="books-section">
    <p class="books-title">All Books</p>
    <div class="books-grid"></div>
  </div>

  <script src="{% static 'JS/search-books.js' %}"></script>

{% endblock %}
