{% extends "base.html" %}
{% load static %}

{% block title %}Online Library | Book Details{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'CSS/homepage-bookdetails.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/book-details.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/details-states.css' %}">
  <link rel="stylesheet" href="{% static 'CSS/navbar.css' %}">
{% endblock %}


{% block content %}

  <h2>Book Details</h2>

  <div class="book-card">
    <div class="image-container">
      <img id="bookImage" width="150">
    </div>
    <div class="book-info">
      <h3 id="title"></h3>
      <p><strong>Author:</strong> <span id="author"></span></p>
      <hr>
      <p><strong>Category:</strong> <span id="category"></span></p>
      <hr>
      <p><strong>Description:</strong> <span id="description"></span></p>
      <hr>
      <p><strong>Status:</strong> <span id="status"></span></p>
      <button class="btn-outline">Borrow Book</button>
    </div>
  </div>

  <script src="{% static 'JS/book-details.js' %}"></script>

{% endblock %}
