{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login to Library</title>
    <link rel="icon" href="../assets/images/Icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'CSS/background.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/login.css' %}">
  </head>
  <body>

    <div class="bg">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="toast" id="toast"></div>

    <div class="container">
      <div class="card">

        <div class="logo">
          <div class="logo-icon">📚</div>
          <span class="logo-text">LIBRARY SYSTEM</span>
        </div>

        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to access your library account</p>

        <form action="/homepage/" method="get">
          {% csrf_token %}

          <div class="field">
            <label for="userEmail">Email address</label>
            <div class="input-wrap">
              <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input
                required
                id="userEmail"
                type="email"
                name="userEmail"
                placeholder="user@example.com"
                autocomplete="email"
              />
            </div>
          </div>

          <div class="field">
            <label for="Password">Password</label>
            <div class="input-wrap">
              <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input
                required
                id="Password"
                type="password"
                name="Password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="eye-btn" onclick="togglePw(this)" aria-label="Toggle password visibility">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <a href="/forgetpass1/" class="forgot">Forgot password?</a>
          </div>

          <button class="btn" type="submit" id="loginBtn">
            <span id="btnText">Sign in</span>
            <span class="loading-dots" id="dots">
              <span></span><span></span><span></span>
            </span>
          </button>

        </form>

        <div class="divider"><span>or</span></div>

        <p class="register">
          Don't have an account? <a href="/register/">Create one</a>
        </p>

      </div>
    </div>

    <script src="{% static 'JS/login.js' %}"></script>
  </body>
</html>
