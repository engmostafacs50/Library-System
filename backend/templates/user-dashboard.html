{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Online Library | User Dashboard</title>
    <link rel="icon" href="{% static 'assets/images/Icon.png' %}"
      type="image/png">
    <link rel="stylesheet" href="{% static 'CSS/background.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/navbar.css' %}">
    <link rel="stylesheet"
      href="{% static 'CSS/UserDashboard-BorrowedBooks.css' %}">
  </head>
  <body>
    <div class="bg-orbs">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
    <nav>
      <span class="nav-brand">Library System</span>
      <div class="nav-links">
        <a href="{% url 'homepage' %}">Home</a>
        <a href="{% url 'user-dashboard' %}"
          class="active">Profile</a>
        <a href="{% url 'search-books' %}">Search</a>
        <a href="{% url 'view-books' %}">Books</a>
        <a href="{% url 'borrowed-books' %}">Borrowed</a>
        <a href="{% url 'returned-books' %}">Returned</a>
      </div>
      <div class="nav-logout"><a href="../index.html">Logout</a></div>
    </nav>

    <div class="container">
      <div class="user-header">
        <img src class="profile-img" id="user-avatar" />
        <h1 id="user-welcome">Welcome!</h1>
        <p class="subtitle">
          "A reader lives a thousand lives before he dies."
        </p>
      </div>

      <div class="card">
        <h2>Reading Statistics</h2>
        <div class="stats-container">
          <div class="stat-item">
            <div class="stat-number" id="stat-active">0</div>
            <div class="stat-label">Active Loans</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="stat-returned">0</div>
            <div class="stat-label">Total Returned</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="stat-total">0</div>
            <div class="stat-label">Total Borrowed</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Suggested for You</h2>
        <div id="suggested-container"> </div>
        <a href="view-books.html" class="btn-explore">Explore All Books</a>
      </div>
    </div>
    <script src="../JS/Users-data.js"></script>
    <script src="../JS/books-data.js"></script>
    <script src="../JS/UserDashboard-BorrowedBooks.js"></script>
  </body>
</html>
