<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Account</title>
    <link rel="stylesheet" href="../CSS/forget pass.css">
</head>
<body>
   <div class="container">
  <div class="box">
    <h1>Find Your Account</h1>

    <h4>Enter your email address</h4>

    <form action="./forgetpass2.html">

      <label for="userEmail">User Email</label>
      <input
        required
        id="userEmail"
        type="email"
        name="userEmail"
        placeholder="Ex: user123@gmail.com"
      />

      <button type="submit">Submit</button>

    </form>

    <p class="back">
      Back to <a href="./login.html">Login</a>
    </p>
  </div>
</div>
</body>
</html>
