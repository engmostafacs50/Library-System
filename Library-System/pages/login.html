<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Online Library</title>
</head>

<body>
    <h1>Login to Library </h1>

    <form action="./homepage.html">
      
      <label for="userEmail">User Email </label>
      <input
        required
        id="userEmail"
        type="email"
        name="userEmail"
        placeholder="Ex:user123@gmail.com"
      />
      <br />
      <br />
      <label for="Password">Password </label>
      <input required id="Password" type="Password" name="Password" />
      <br />
      <br />
      
      <button type="submit">Login</button>

      <h4>Forget your <a href="./forgetpass1.html">Password?</a> </h4>
      
    </form>

    <h4>Dosen't Have Account?<a href="../index.html">Register</a> </h4>

</body>
</html>
