<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Library | Add New Book</title>
    <link rel="stylesheet" href="../CSS/background.css">
    <link rel="stylesheet" href="../CSS/register.css"> <link rel="stylesheet" href="../CSS/search-books.css"> </head>
<body>
    <div class="bg-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
    </div>

    <nav>
        <div class="nav-links">
            <a href="dashboard.html">Admin Profile</a>
            <a href="add-book.html" style="color: #818cf8;">Add Book</a>
            <a href="manage-books.html">Manage Books</a>
            <a href="../index.html" class="logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="register-box" style="margin-top: 50px; width: 450px;">
            <h1 style="background: linear-gradient(to right, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Add New Book</h1>
            
            <form id="addBookForm" class="Parent">
                <label>Book ID</label>
                <input type="number" id="bookId" placeholder="e.g. 101">

                <label>Book Title</label>
                <input type="text" id="bookName" placeholder="Enter title">

                <label>Author Name</label>
                <input type="text" id="author" placeholder="Enter author">

                <label>Category</label>
                <select id="category" style="padding: 12px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; outline: none;">
                    <option value="">-- Choose --</option>
                    <option value="Programming">Programming</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Science">Science</option>
                </select>

                <label>Description</label>
                <textarea id="description" rows="3" style="padding: 12px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; outline: none;"></textarea>

                <button type="submit" class="btn-explore" style="width: 100%; border: none; padding: 15px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; background: linear-gradient(135deg, #4f46e5, #9333ea);">
                    Save Book Information
                </button>
            </form>
        </div>
    </div>

    <script src="../JS/add-book.js"></script>
</body>
</html>
