<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Online Library | User Dashboard</title>
    <link rel="icon" href="../assets/images/Icon.png" type="image/png">
    <link rel="stylesheet" href="../CSS/UserDashboard-BorrowedBooks.css" />
  </head>
  <body>
    <nav>
      <a href="homepage.html">Home</a>
      <a href="user-dashboard.html">Profile</a>
      <a href="search-books.html">Search</a>
      <a href="view-books.html">Books</a>
      <a href="borrowed-books.html">Borrowed</a>
      <a href="../index.html">Logout</a>
    </nav>

    <div class="container">
      <div class="user-header">
        <img src="" class="profile-img" id="user-avatar" />
        <h1 id="user-welcome">Welcome!</h1>
        <p class="subtitle">
          "A reader lives a thousand lives before he dies."
        </p>
      </div>

      <div class="card">
        <h2>Reading Statistics</h2>
        <div class="stats-container">
          <div class="stat-item">
            <div class="stat-number" id="stat-active">0</div>
            <div class="stat-label">Active Loans</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="stat-returned">0</div>
            <div class="stat-label">Total Returned</div>
          </div>
          <div class="stat-item">
            <div class="stat-number" id="stat-total">0</div>
            <div class="stat-label">Total Borrowed</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Suggested for You</h2>
        <div id="suggested-container">
          <a href="book-details.html?id=1" class="suggested-book-link">
            <div style="font-size: 50px; margin-bottom: 10px"></div>
            <p style="font-weight: bold">Clean Code</p>
            <small style="color: #818cf8">Robert C. Martin</small>
          </a>
        </div>
        <a href="view-books.html" class="btn-explore">Explore All Books</a>
      </div>
    </div>
    <script src = "../JS/books-data.js"></script>
    <script src="../JS/UserDashboard-BorrowedBooks.js"></script>
  </body>
</html>
