<!DOCTYPE html>
<html lang="en">
<head>
    <title>Online Library | Search Books</title>
    <link rel="icon" href="../assets/images/Icon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/search-books.css">
</head>
<body>

<nav>
    <div class="nav-links">
        <a href="homepage.html">Home</a>
        <a href="user-dashboard.html">Dashboard</a>
        <a href="view-books.html">Books</a>
        <a href="borrowed-books.html">Borrowed</a>
        <a href="returned-books.html">Returned</a>
    </div>
    <div class="logout">
        <a href="../index.html">Logout</a>
    </div>
</nav>

<div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
</div>

<div class="hero">
    <div class="label-chip">Online Library</div>
    <h2>Search for a Book</h2>

    <div class="search-wrap">
        <div class="search-box">
            <svg class="search-icon" width="18" height="18" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" placeholder="Enter book name, author, or genre..." />
            <button class="search-btn">Search</button>
        </div>
    </div>
</div>

<div class="books-section">
    <p class="books-title">All Books</p>
    <div class="books-grid"></div>
</div>
<script src="../JS/books-data.js"></script>
<script src="../JS/search-books.js"></script>

</body>
</html>
