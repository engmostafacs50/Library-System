<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body>
    <h1>Register</h1>
    <br />

    <form action="./pages/login.html">
      <label for="UserName">User Name </label>
      <input
        required
        id="UserName"
        type="text"
        name="UserName"
        placeholder="Ex:Ahmed"
      />
      <br />
      <br />

      <label for="userEmail">User Email </label>
      <input
        required
        id="userEmail"
        type="email"
        name="userEmail"
        placeholder="Ex:user123@gmail.com"
      />
      <br />
      <br />
      <label for="Password">Password </label>
      <input required id="Password" type="Password" name="Password" />
      <br />
      <br />
      <label for="ConfirmPassword">ConfirmPassword </label>
      <input
        required
        id="ConfirmPassword"
        type="Password"
        name="ConfirmPassword"
      />
      <br />
      <br />
      <label for="date">User Age </label>
      <input id="date" type="date" name="date" />
      <br />
      <br />
      <label for=" Admin">Admin </label>
      <input
        required
        id="Admin"
        type="radio"
        name="Accessibility"
        value="Admin"
      />

      <label for=" Admin">User </label>
      <input
        required
        id="User"
        type="radio"
        name="Accessibility"
        value="User"
      />
      <br />
      <br />
      <button type="reset">Reset</button>
      <button type="submit">Submit</button>
    </form>

    <h3>Already have account?<a href="./pages/login.html">login</a></h3>
    <!-- <a href="./pages/forgetpass.html">forgt pass</a> -->
  </body>
</html>
